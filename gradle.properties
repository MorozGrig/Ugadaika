# Свойства Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Отключаем Data Binding (в проекте используется только View Binding).
# Это предотвращает ошибку "Cannot mutate the dependencies of configuration ':app:debugCompileClasspath'"
# при сборке под Gradle 9.x / новыми версиями Android Gradle Plugin.
android.enableDataBinding=false
android.defaults.buildfeatures.databinding=false
